cache:
  enable: false
  duration: 1m
  replicaCount: 1
  endpoint: "api.whylabsapp.com"
  annotations: {}
  labels: {}

# -- Number of replicas for the service.
replicaCount: 4

image:
  # -- Image repository for the `guardrails` container.
  repository: registry.gitlab.com/whylabs/langkit-container
  # -- Image pull policy for the `guardrails` container.
  pullPolicy: IfNotPresent
  # -- (string) Image tag for the `guardrails` container, this will default to
  # `.Chart.AppVersion` if not set.
  tag: "2.2.2"

imagePullSecrets:
  # -- (list) Image pull secrets for the `guardrails` container. Defaults to
  # `whylabs-{{ .Release.Name }}-registry-credentials` if `name: ""`. To exclude
  # The ImagePullSecret entirely, set `imagePullSecrets: []` and comment out the
  # list items.
  - name: ""

# -- (string) Override the name of the chart.
nameOverride: ""

# -- (string) Override the full name of the chart.
fullnameOverride: ""

# -- Labels to add to all chart resources.
commonLabels: {}

# -- [Environment variables](https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/) for the `guardrails` container.
env: {}
  # MY_ENV_VAR: "my env var value"

# -- Create environment variables from Kubernetes secrets or config maps.
envFrom:
  - secretRef:
      name: whylabs-guardrails-api-key
      optional: true
  - secretRef:
      name: whylabs-guardrails-api-secret
      optional: true

serviceAccount:
  # -- If `true`, create a new `ServiceAccount`.
  create: true
  # -- (string) If this is set and `serviceAccount.create` is `true` this will be used for the created `ServiceAccount` name, if set and `serviceAccount.create` is `false` then this will define an existing `ServiceAccount` to use.
  name: ""
  # -- Labels to add to the service account.
  labels: {}
  # -- Annotations to add to the service account.
  annotations: {}
  # -- Set this to `false` to [opt out of API credential automounting](https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting) for the `ServiceAccount`.
  automount: true

service:
  # -- Service annotations.
  annotations: {}
  # -- Service Type, i.e. ClusterIp, LoadBalancer, etc.
  type: ClusterIP
  # -- Service HTTP port.
  port: 80
  # -- The port on which the application container is listening.
  targetPort: 8000
  
# -- Annotations to add to the `Pod`.
podAnnotations: {}

# -- Labels to add to the `Pod`.
podLabels: {}

# -- [Pod security context](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.22/#podsecuritycontext-v1-core), this supports full customisation.
podSecurityContext:
  runAsNonRoot: true

# -- [Security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container) for the `guardrails` container.
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop: ["ALL"]

# -- [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/) configuration for the `guardrails` container.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- [Resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/) for the `guardrails` container.
resources:
  requests:
    cpu: "4"
    memory: 4Gi
    ephemeral-storage: 250Mi
  limits:
    cpu: "4"
    memory: 4Gi
    ephemeral-storage: 250Mi

# -- [Readiness probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/) configuration for the `guardrails` container. Liveness and readiness probes are suppressed until the startup probe succeeds.
startupProbe:
  httpGet:
    path: /health
    port: 8000
  failureThreshold: 20
  initialDelaySeconds: 20
  periodSeconds: 10

# -- [Liveness probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/) configuration for the `guardrails` container. Failed livenessProbes restarts containers
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  failureThreshold: 5
  periodSeconds: 10

# -- [Readiness probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/) configuration for the `guardrails` container. Failed readinessProbes remove the pod from the service.
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  failureThreshold: 2
  periodSeconds: 10

# -- [Horizontal Pod Autoscaler](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/) configuration for the `guardrails` container.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  behavior:
    scaleUp:
      policies:
        - type: Pods
          value: "{{ .Values.replicaCount | int }}"
          periodSeconds: 180
        - type: Percent
          value: 50
          periodSeconds: 180
      # selectPolicy can be `Min` or `Max` and refers to scaling policy
      # to choose when there are multiple policies; `Max` will choose the
      # policy perform the largest scaling adjustment, while `Min` will
      # choose the policy that performs the smallest scaling adjustment.
      selectPolicy: Min
      stabilizationWindowSeconds: 180
    scaleDown:
      policies:
        - type: Pods
          value: "{{ .Values.replicaCount | int }}"
          # periodSeconds is the rate at which a policy can be applied;
          # this policy may only be applied once per period.
          periodSeconds: 180
        - type: Percent
          value: 30
          # periodSeconds is the rate at which a policy can be applied;
          # this policy may only be applied once per period.
          periodSeconds: 180
      selectPolicy: Max
      # stabilizationWindowSeconds is how many seconds the HPA looks back
      # to determine if a policy is being met.
      stabilizationWindowSeconds: 300
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 70

# -- Extra [volumes](https://kubernetes.io/docs/concepts/storage/volumes/) for the `Pod`.
extraVolumes: []

# -- Extra [volume mounts](https://kubernetes.io/docs/concepts/storage/volumes/) for the `guardrails` container.
extraVolumeMounts: []

# -- Node labels to match for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
nodeSelector: {}

# -- Node taints which will be tolerated for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
tolerations: []

# -- Affinity settings for `Pod` [scheduling](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/). If an explicit label selector is not provided for pod affinity or pod anti-affinity one will be created from the pod selector labels.
affinity: {}
